# Maps the ORIGINAL TCP peer IP ($realip_remote_addr) to $mash_edge
# Place in /etc/nginx/conf.d/mash-edge-geo.conf (inside http {} block).
# IMPORTANT: Replace YOUR_VPS_PUBLIC_IP/32 with your actual VPS public IPv4 (curl -s https://api.ipify.org).

geo $realip_remote_addr $mash_edge {
    default "direct";

    # Loopback / this server (Next.js BFF calling backend)
    127.0.0.1/32 "self";
    ::1/128 "self";
    # YOUR_VPS_PUBLIC_IP/32 "self";

    # Cloudflare IPv4
    173.245.48.0/20 "cf";
    103.21.244.0/22 "cf";
    103.22.200.0/22 "cf";
    103.31.4.0/22 "cf";
    141.101.64.0/18 "cf";
    108.162.192.0/18 "cf";
    190.93.240.0/20 "cf";
    188.114.96.0/20 "cf";
    197.234.240.0/22 "cf";
    198.41.128.0/17 "cf";
    162.158.0.0/15 "cf";
    104.16.0.0/13 "cf";
    104.24.0.0/14 "cf";
    172.64.0.0/13 "cf";
    131.0.72.0/22 "cf";

    # Cloudflare IPv6
    2400:cb00::/32 "cf";
    2606:4700::/32 "cf";
    2803:f800::/32 "cf";
    2405:b500::/32 "cf";
    2405:8100::/32 "cf";
    2a06:98c0::/29 "cf";
    2c0f:f248::/32 "cf";
}

